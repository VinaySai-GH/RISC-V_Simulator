[pipeline]
forwarding_enabled = true

[latencies]
ADD = 1
MUL = 3
L = 1
S = 1

[memory]
virtual_size_bytes = 1048576
physical_size_bytes = 262144
page_size_bytes = 4096

[vm]
; Increase to 32 to stop TLB thrashing
dtlb_entries = 64
tlb_hit_latency = 1
page_walk_latency = 10
page_fault_latency = 50
replacement_policy = lru

[cache]
; Increase to 16KB and 4-way associativity to stop Cache thrashing
l1_size_bytes = 65536
associativity = 32
l1_latency = 1
block_size_bytes = 64
